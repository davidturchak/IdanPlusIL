org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official

# The system default "java 21" on this machine is a JRE - it has no javac.
# JDK 17 is the only complete JDK present, and AGP 8.10 requires 17+.
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64

# App version. Bumped by tools/release.sh; do not edit by hand mid-release.
# versionCode is what the self-update check compares, so it must only go up.
idanplusil.versionCode=1
idanplusil.versionName=1.0.0
