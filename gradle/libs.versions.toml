[versions]
agp                = "8.10.1"       # ceiling for Gradle 8.11.1
kotlin             = "2.2.20"       # KGP + compose + serialization plugins share this
composeBom         = "2026.03.01"   # -> compose ui 1.10.6 / material3 1.4.0
tvMaterial         = "1.1.0"
media3             = "1.9.4"        # newest with minCompileSdk 35
coil               = "3.4.0"        # newest with minCompileSdk 35
okhttp             = "4.12.0"       # what media3-datasource-okhttp:1.9.4 declares
jsoup              = "1.18.3"
coroutines         = "1.10.2"
serializationJson  = "1.9.0"
coreKtx            = "1.16.0"
activityCompose    = "1.10.1"
lifecycle          = "2.9.4"
datastore          = "1.1.1"
splashscreen       = "1.0.1"
profileinstaller   = "1.4.1"
junit              = "4.13.2"

[libraries]
androidx-core-ktx            = { module = "androidx.core:core-ktx",                         version.ref = "coreKtx" }
androidx-splashscreen        = { module = "androidx.core:core-splashscreen",                version.ref = "splashscreen" }
androidx-activity-compose    = { module = "androidx.activity:activity-compose",             version.ref = "activityCompose" }
androidx-lifecycle-runtime   = { module = "androidx.lifecycle:lifecycle-runtime-ktx",       version.ref = "lifecycle" }
androidx-lifecycle-compose   = { module = "androidx.lifecycle:lifecycle-runtime-compose",   version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-datastore           = { module = "androidx.datastore:datastore-preferences",       version.ref = "datastore" }
androidx-profileinstaller    = { module = "androidx.profileinstaller:profileinstaller",     version.ref = "profileinstaller" }

compose-bom                  = { module = "androidx.compose:compose-bom",                   version.ref = "composeBom" }
compose-foundation           = { module = "androidx.compose.foundation:foundation" }
compose-ui                   = { module = "androidx.compose.ui:ui" }
compose-ui-graphics          = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling           = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview   = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-animation            = { module = "androidx.compose.animation:animation" }

tv-material                  = { module = "androidx.tv:tv-material",                        version.ref = "tvMaterial" }

media3-exoplayer             = { module = "androidx.media3:media3-exoplayer",               version.ref = "media3" }
media3-exoplayer-hls         = { module = "androidx.media3:media3-exoplayer-hls",           version.ref = "media3" }
media3-exoplayer-dash        = { module = "androidx.media3:media3-exoplayer-dash",          version.ref = "media3" }
media3-datasource-okhttp     = { module = "androidx.media3:media3-datasource-okhttp",       version.ref = "media3" }
media3-ui-compose            = { module = "androidx.media3:media3-ui-compose",              version.ref = "media3" }
media3-common                = { module = "androidx.media3:media3-common",                  version.ref = "media3" }

okhttp                       = { module = "com.squareup.okhttp3:okhttp",                    version.ref = "okhttp" }
okhttp-logging               = { module = "com.squareup.okhttp3:logging-interceptor",       version.ref = "okhttp" }
okhttp-mockwebserver         = { module = "com.squareup.okhttp3:mockwebserver",             version.ref = "okhttp" }
jsoup                        = { module = "org.jsoup:jsoup",                                version.ref = "jsoup" }

coil-compose                 = { module = "io.coil-kt.coil3:coil-compose",                  version.ref = "coil" }
coil-network-okhttp          = { module = "io.coil-kt.coil3:coil-network-okhttp",           version.ref = "coil" }

kotlinx-coroutines-core      = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "coroutines" }
kotlinx-coroutines-android   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test      = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",    version.ref = "coroutines" }
kotlinx-serialization-json   = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }

junit                        = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application  = { id = "com.android.application",                   version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin" }
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm",                  version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
